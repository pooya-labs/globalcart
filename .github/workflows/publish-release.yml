name: Publish GlobalCart 1.0.0

on:
  workflow_run:
    workflows: ["Public Lighthouse lab audit"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: globalcart-v1-release
  cancel-in-progress: false

jobs:
  release_gate:
    if: ${{ needs.release_gate.result == 'success' && needs.release_gate.outputs.needs_release == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - name: Check whether the stable release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            echo "Stable v1.0.0 already exists; skipping the full release verification."
          else
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
            echo "No stable v1.0.0 release exists; the full release gate is required."
          fi

  verify-and-publish:
    needs: release_gate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the release candidate from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify the release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$version" = "1.0.0"
          grep -q '^## 1.0.0 — GlobalCart portfolio demo release' CHANGELOG.md
          test -s docs/releases/v1.0.0.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release manifest is consistent: $version"

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Install the pinned image optimizer
        run: npm install --no-save --package-lock=false --no-audit --no-fund sharp@0.35.5

      - name: Prepare self-hosted site imagery
        run: npm run assets:sync

      - name: TypeScript validation
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production static build for deterministic browser verification
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_E2E_FIXTURE_CATALOG: "1"

      - name: Install cross-browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Full Browser E2E and axe suite
        run: npm run test:e2e

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          rm -f "$report"
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$RUNNER_TEMP:/reports" \
            zricethezav/gitleaks:v8.24.3 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --report-format=json \
            --report-path=/reports/gitleaks-report.json \
            --no-banner
          scan_status=$?
          set -e

          if [ -s "$report" ]; then
            node - "$report" <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const findings = Array.isArray(parsed) ? parsed : (parsed.findings ?? []);
          if (!findings.length) {
            process.stdout.write("Gitleaks produced no structured findings.\n");
          } else {
            process.stdout.write(`Gitleaks structured findings: ${findings.length}\n`);
            for (const [index, finding] of findings.entries()) {
              const safe = {
                index: index + 1,
                ruleID: finding.RuleID ?? finding.ruleID ?? "unknown",
                file: finding.File ?? finding.file ?? "unknown",
                commit: finding.Commit ?? finding.commit ?? "unknown",
                startLine: finding.StartLine ?? finding.startLine ?? null,
                endLine: finding.EndLine ?? finding.endLine ?? null,
                fingerprint: finding.Fingerprint ?? finding.fingerprint ?? "unavailable"
              };
              process.stdout.write(JSON.stringify(safe) + "\n");
            }
          }
          NODE
          else
            echo "Gitleaks did not write a structured report; scan exit: $scan_status"
          fi

          exit "$scan_status"

      - name: Verify the published storefront, product and case study
        shell: bash
        env:
          SITE_BASE: https://pooya-labs.github.io/globalcart
        run: |
          set -euo pipefail
          product_id="$(node -e 'const p=require("./data/catalog.json").products; if(!Array.isArray(p)||!p[0]?.id)process.exit(1); process.stdout.write(String(p[0].id))')"
          home="$(mktemp)"
          product="$(mktemp)"
          case_study="$(mktemp)"
          trap 'rm -f "$home" "$product" "$case_study"' EXIT
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$SITE_BASE/" --output "$home"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$SITE_BASE/product/$product_id/" --output "$product"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$SITE_BASE/case-study/" --output "$case_study"
          node - "$home" "$product" "$case_study" "$product_id" <<'NODE'
          const fs = require("node:fs");
          const [homeFile, productFile, caseFile, id] = process.argv.slice(2);
          const home = fs.readFileSync(homeFile, "utf8");
          const product = fs.readFileSync(productFile, "utf8");
          const study = fs.readFileSync(caseFile, "utf8");
          for (const [name, html] of [["home", home], ["product", product], ["case study", study]]) {
            if (!html.includes("<html") || /<title>404[ -]/i.test(html)) {
              throw new Error("Published " + name + " route is missing or returned 404.");
            }
          }
          if (!product.includes(id) || !product.includes("detail-main-image") || !product.includes("detail-price")) {
            throw new Error("Published product route is missing its product identity, gallery or price region.");
          }
          if (product.includes("Price not listed")) {
            throw new Error("Published representative product page has no visible demo estimate.");
          }
          if (!study.includes("DATABASE_ERD.md")) {
            throw new Error("Published case study is missing its architecture/ERD reference.");
          }
          NODE
          echo "Public Pages smoke passed for the storefront, representative product detail and bilingual case study."

      - name: Confirm main contains only verified generated-data updates
        id: final_target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tested_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          final_sha="$tested_sha"

          if [ "$tested_sha" != "$main_sha" ]; then
            changed_files="$(git diff --name-only "$tested_sha" "$main_sha")"
            while IFS= read -r file; do
              case "$file" in
                data/catalog.json|data/fx-rate.json|docs/screenshots/*.png|public/images/catalog/*.webp|public/images/site/*.webp)
                  ;;
                *)
                  echo "::error::main changed an application or release file during verification: $file"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            if printf '%s\n' "$changed_files" | grep -qx 'data/catalog.json'; then
              node - "$tested_sha" "$main_sha" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [tested, current] = process.argv.slice(2);
          const load = sha => JSON.parse(execFileSync("git", ["show", sha + ":data/catalog.json"], { encoding: "utf8", maxBuffer: 32 * 1024 * 1024 }));
          const normalize = snapshot => ({
            schemaVersion: snapshot.schemaVersion,
            source: snapshot.source,
            productCount: snapshot.productCount,
            products: snapshot.products.map(({ importedAt, ...product }) => product)
          });
          if (JSON.stringify(normalize(load(tested))) !== JSON.stringify(normalize(load(current)))) {
            throw new Error("The deployment catalog refresh changed product content, not only generation/import timestamps.");
          }
          NODE
            fi

            if printf '%s\n' "$changed_files" | grep -qx 'data/fx-rate.json'; then
              node - "$main_sha" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [current] = process.argv.slice(2);
          const fx = JSON.parse(execFileSync("git", ["show", current + ":data/fx-rate.json"], { encoding: "utf8" }));
          if (fx.schemaVersion !== 3 || fx.provider !== "TGJU" || fx.instrument !== "price_dollar_rl" ||
              fx.baseCurrency !== "USD" || fx.displayQuoteCurrency !== "TOMAN" ||
              !Number.isFinite(fx.tomanPerUsd) || fx.tomanPerUsd <= 0) {
            throw new Error("The latest generated FX snapshot does not satisfy the TGJU source contract.");
          }
          NODE
            fi

            final_sha="$main_sha"
            echo "Accepted generated-data-only updates after verification: $changed_files"
          fi

          echo "target_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Verified release target: $final_sha"

      - name: Create the 1.0.0 GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TARGET_SHA: ${{ steps.final_target.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "GlobalCart $VERSION" \
            --notes-file docs/releases/v1.0.0.md

      - name: Publish release summary
        if: success()
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          TARGET_SHA: ${{ steps.final_target.outputs.target_sha }}
        run: |
          {
            printf '## GlobalCart %s published\n\n' "$VERSION"
            printf '%s\n' \
              "- Tag: v$VERSION" \
              "- Commit: $TARGET_SHA" \
              "- Release: https://github.com/pooya-labs/globalcart/releases/tag/v$VERSION" \
              "- Scope: stable portfolio/demo release; no production commerce or real transactions." \
              "- Hardware, screen-reader, comprehensive manual RTL/LTR and field Core Web Vitals checks are not claimed as completed."
          } >> "$GITHUB_STEP_SUMMARY"
