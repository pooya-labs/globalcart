name: Sync TGJU FX snapshot
on:
  schedule:
    # Five-minute cadence, offset from the hour boundary; GitHub schedules are best-effort.
    - cron: "3-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fx-rate.yml"
      - "lib/fx/**"
      - "scripts/sync-tgju-fx.ts"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgju-fx-snapshot
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Fetch and validate the TGJU free-market dollar page
        run: npx tsx scripts/sync-tgju-fx.ts
      - name: Persist the validated quote and request a static-site refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          quote="$RUNNER_TEMP/fx-rate.json"
          cp data/fx-rate.json "$quote"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$quote" data/fx-rate.json
            git add -- data/fx-rate.json
            if git diff --cached --quiet; then
              echo "TGJU quote is unchanged; no snapshot commit or Pages rebuild is needed."
              exit 0
            fi
            git commit -m "chore(fx): refresh TGJU free-market USD quote [skip ci]"
            if git push origin HEAD:main; then
              # GITHUB_TOKEN pushes intentionally do not trigger push workflows.
              # Dispatch only after a changed snapshot is safely committed.
              gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
                -f event_type=globalcart-fx-updated
              echo "Requested a GitHub Pages rebuild for the updated TGJU snapshot."
              exit 0
            fi
            echo "main moved during FX snapshot persistence (attempt $attempt); retrying."
          done
          echo "::error::Could not persist the FX snapshot without a concurrent main update."
          exit 1
