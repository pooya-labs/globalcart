name: Deploy GlobalCart to GitHub Pages
# CI validates the application, runs domain unit tests, and builds the static Pages artifact.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      smoke_product_id: ${{ steps.smoke_product.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh static catalog snapshot
        run: npm run catalog:sync
      - name: Select a static product route for deployment smoke test
        id: smoke_product
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
          const product = catalog.products?.find((item) =>
            Number.isSafeInteger(item.id) && item.id > 0 && typeof item.title === "string" && item.title.trim()
          );
          if (!product) throw new Error("Catalog snapshot has no valid product route for the deployment smoke test.");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `product_id=${product.id}\\n`);
          NODE
      - name: Persist refreshed catalog snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the newly generated file outside the worktree. A soft reset
          # leaves the old index intact and can therefore delete concurrent main
          # changes when the bot creates its commit.
          snapshot="$RUNNER_TEMP/catalog.json"
          cp data/catalog.json "$snapshot"

          # Rebuild a catalog-only commit from the latest main on every attempt.
          # A non-fast-forward push is retried; force-push is never used.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/catalog.json
            git add -- data/catalog.json

            if git diff --cached --quiet; then
              echo "Catalog snapshot is unchanged."
              exit 0
            fi

            git commit -m "chore(catalog): refresh snapshot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during catalog persistence (attempt $attempt); retrying against latest main."
          done

          echo "::error::Could not persist catalog snapshot without a concurrent main update."
          exit 1
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Prepare Pages artifact
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published Pages homepage, assets and product deep link
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PRODUCT_ID: ${{ needs.build.outputs.smoke_product_id }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          home_html="$(mktemp)"
          product_html="$(mktemp)"
          trap 'rm -f "$home_html" "$product_html"' EXIT

          case "$base_url" in
            https://*) ;;
            *) echo "Expected HTTPS Pages URL, received: $base_url" >&2; exit 1 ;;
          esac
          test -n "$PRODUCT_ID"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$base_url" --output "$home_html"

          # Resolve the first built JavaScript chunk and verify the repository basePath
          # is present in its URL before requesting the actual asset from Pages.
          asset_url="$(node - "$home_html" "$base_url" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const base = new URL(process.argv[3]);
          const script = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:[?#][^"']*)?)["'][^>]*>/g)]
            .map((match) => match[1])
            .find((value) => value.includes("/_next/static/"));
          if (!script) throw new Error("Published homepage does not reference a Next.js static JavaScript asset.");
          const asset = new URL(script, base);
          const expectedPrefix = base.pathname.endsWith("/") ? base.pathname : base.pathname + "/";
          if (!asset.pathname.startsWith(expectedPrefix + "_next/static/")) {
            throw new Error(`Static asset escaped the GitHub Pages base path: ${asset.pathname}`);
          }
          process.stdout.write(asset.href);
          NODE
          )"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$asset_url" --output /dev/null

          product_url="${base_url}product/${PRODUCT_ID}/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$product_url" --output "$product_html"

          node - "$product_html" "$PRODUCT_ID" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const productID = process.argv[3];
          if (!/<h1\\b[^>]*>/.test(html) || !html.includes(productID) || /<title>404[ -]/i.test(html)) {
            throw new Error(`Published product deep link is not the expected product page: ${productID}`);
          }
          NODE

          echo "GitHub Pages smoke test passed: homepage, basePath JavaScript asset and product route $PRODUCT_ID."
