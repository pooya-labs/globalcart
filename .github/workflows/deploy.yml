name: Deploy GlobalCart to GitHub Pages
# CI validates the application, runs domain unit tests, and builds the static Pages artifact.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
  repository_dispatch:
    types: [globalcart-fx-updated]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      smoke_product_id: ${{ steps.smoke_product.outputs.product_id }}
      smoke_image_path: ${{ steps.smoke_product.outputs.image_path }}
      smoke_gallery_image_path: ${{ steps.smoke_product.outputs.gallery_image_path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        id: dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --no-audit --no-fund
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned server-side image optimizer
        run: npm install --no-save --package-lock=false --no-audit --no-fund sharp@0.35.5
      - name: Refresh static catalog snapshot
        id: catalog_refresh
        # The committed snapshot is the last-known-good source if ABO rate-limits a refresh.
        continue-on-error: true
        run: npm run catalog:sync
      - name: Validate last-known-good catalog after an upstream refresh failure
        if: steps.catalog_refresh.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const snapshot = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
          const products = snapshot.products || [];
          if (products.length !== 1000) {
            throw new Error(`ABO refresh failed and the committed fallback is incomplete: ${products.length}/1,000 products.`);
          }
          const invalid = products.filter(product =>
            product.priceAvailable !== false ||
            product.priceKind !== "estimated" ||
            !Number.isFinite(product.price) ||
            product.price <= 0 ||
            product.ratingAvailable !== false ||
            product.stockAvailable !== false
          );
          if (invalid.length) {
            throw new Error(`ABO refresh failed and ${invalid.length} fallback products violate demo-price/source-provenance rules.`);
          }
          console.warn("ABO refresh was rate-limited. Retaining the validated 1,000-product committed snapshot; the later gallery smoke still verifies every local image.");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "### Catalog refresh fallback\n\nABO rate-limited the refresh. The build is continuing with the committed last-known-good snapshot after validating all 1,000 demo estimates and source-unavailable flags. The following deployment validation still checks every local gallery image.\n");
          NODE
      - name: Prepare optimized self-hosted site imagery
        run: npm run assets:sync
      - name: Select a static product route for deployment smoke test
        id: smoke_product
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
          const products = catalog.products || [];
          if (products.length !== 1000) throw new Error(`Expected exactly 1,000 embedded catalog products, found ${products.length}.`);
          const localImages = products.filter(item => typeof item.thumbnail === "string" && item.thumbnail.startsWith("/images/catalog/"));
          const categoryCount = new Set(products.map(item => item.category).filter(Boolean)).size;
          if (localImages.length !== products.length) throw new Error(`Expected a local image for every product; found ${localImages.length}/${products.length}.`);
          if (categoryCount < 8) throw new Error(`Catalog is not category-diverse enough: only ${categoryCount} categories.`);
          let totalImages = 0;
          for (const product of products) {
            const images = [product.thumbnail, ...(Array.isArray(product.images) ? product.images : [])];
            if (!images.length) throw new Error(`Product has no gallery images: ${product.sourceId}`);
            if (new Set(images).size !== images.length) {
              throw new Error(`Duplicate image paths in product gallery: ${product.sourceId}`);
            }
            for (const image of images) {
              if (typeof image !== "string" || !image.startsWith("/images/catalog/")) {
                throw new Error(`Product image is not a self-hosted catalog asset: ${product.sourceId} / ${image}`);
              }
              const relative = image.startsWith("/") ? image.slice(1) : image;
              const file = require("node:path").join(process.cwd(), "public", relative);
              if (!fs.existsSync(file) || fs.statSync(file).size < 1000) {
                throw new Error(`Missing or invalid local product image for ${product.sourceId}: ${image}`);
              }
              if (!image.endsWith(".webp")) throw new Error(`Catalog image was not optimized to WebP: ${image}`);
              totalImages += 1;
            }
            if (product.priceAvailable !== false || product.priceKind !== "estimated" || !Number.isFinite(product.price) || product.price <= 0 || product.ratingAvailable !== false || product.stockAvailable !== false) {
              throw new Error(`Expected a positive local estimate while source price, rating and stock remain unverified: ${product.sourceId}`);
            }
          }
          const galleryProducts = products.filter(item => Array.isArray(item.images) && item.images.length > 0);
          if (galleryProducts.length === 0) throw new Error("No product with a distinct alternate gallery image was imported.");
          const product = galleryProducts[0];
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `product_id=${product.id}\nimage_path=${product.thumbnail}\ngallery_image_path=${product.images[0]}\n`);
          console.log(`Validated ${products.length} listings with stable local price estimates, ${galleryProducts.length} multi-image galleries and ${totalImages} distinct local gallery images; source prices, ratings and stock remain unverified.`);
          NODE
      - name: Persist refreshed catalog snapshot, site imagery and npm lockfile safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the newly generated file outside the worktree. A soft reset
          # leaves the old index intact and can therefore delete concurrent main
          # changes when the bot creates its commit.
          snapshot="$RUNNER_TEMP/catalog.json"
          package_lock="$RUNNER_TEMP/package-lock.json"
          site_images="$RUNNER_TEMP/site-images"
          catalog_images="$RUNNER_TEMP/catalog-images"
          cp data/catalog.json "$snapshot"
          test -f package-lock.json
          cp package-lock.json "$package_lock"
          mkdir -p "$site_images" "$catalog_images"
          cp -R public/images/site/. "$site_images/"
          cp -R public/images/catalog/. "$catalog_images/"

          # Rebuild the snapshot/lockfile commit from the latest main on every attempt.
          # A non-fast-forward push is retried; force-push is never used.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/catalog.json
            cp "$package_lock" package-lock.json
            mkdir -p public/images/site public/images/catalog
            cp -R "$site_images/." public/images/site/
            cp -R "$catalog_images/." public/images/catalog/
            git add -- data/catalog.json package-lock.json public/images/site/ public/images/catalog/

            if git diff --cached --quiet; then
              echo "Generated snapshots and site imagery are unchanged."
              exit 0
            fi

            git commit -m "chore(ci): persist catalog snapshot, lockfile and site imagery [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during catalog persistence (attempt $attempt); retrying against latest main."
          done

          echo "::error::Could not persist snapshot and lockfile without a concurrent main update."
          exit 1

      - name: Validate generated lockfile with a clean npm ci
        if: steps.dependencies.outputs.bootstrapped == 'true'
        run: npm ci --no-audit

      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Prepare Pages artifact
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The 1,000-product catalog publishes ~4,900 local gallery files.
          # Pages can spend more than ten minutes in syncing_files; keep the
          # image set intact and give the provider a 20-minute deployment window.
          timeout: 1200000

      - name: Smoke test published Pages homepage, assets, product and case study routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PRODUCT_ID: ${{ needs.build.outputs.smoke_product_id }}
          PRODUCT_IMAGE_PATH: ${{ needs.build.outputs.smoke_image_path }}
          GALLERY_IMAGE_PATH: ${{ needs.build.outputs.smoke_gallery_image_path }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          home_html="$(mktemp)"
          product_html="$(mktemp)"
          case_study_html="$(mktemp)"
          icon_file="$(mktemp)"
          site_image_file="$(mktemp)"
          gallery_image_file="$(mktemp)"
          trap 'rm -f "$home_html" "$product_html" "$case_study_html" "$icon_file" "$site_image_file" "$gallery_image_file"' EXIT

          case "$base_url" in
            https://*) ;;
            *) echo "Expected HTTPS Pages URL, received: $base_url" >&2; exit 1 ;;
          esac
          test -n "$PRODUCT_ID"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$base_url" --output "$home_html"

          # Resolve the first built JavaScript chunk and verify the repository basePath
          # is present in its URL before requesting the actual asset from Pages.
          asset_url="$(node - "$home_html" "$base_url" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const base = new URL(process.argv[3]);
          const script = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:[?#][^"']*)?)["'][^>]*>/g)]
            .map((match) => match[1])
            .find((value) => value.includes("/_next/static/"));
          if (!script) throw new Error("Published homepage does not reference a Next.js static JavaScript asset.");
          const asset = new URL(script, base);
          const expectedPrefix = base.pathname.endsWith("/") ? base.pathname : base.pathname + "/";
          if (!asset.pathname.startsWith(expectedPrefix + "_next/static/")) {
            throw new Error(`Static asset escaped the GitHub Pages base path: ${asset.pathname}`);
          }
          process.stdout.write(asset.href);
          NODE
          )"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$asset_url" --output /dev/null

          # Resolve and fetch the published SVG icon using the configured Pages base path.
          icon_url="$(node - "$home_html" "$base_url" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const base = new URL(process.argv[3]);
          const tags = [...html.matchAll(/<link\b[^>]*>/gi)].map(match => match[0]);
          const iconTag = tags.find(tag => /\brel=["'][^"']*\bicon\b[^"']*["']/i.test(tag));
          const href = iconTag?.match(/\bhref=["']([^"']+)["']/i)?.[1];
          if (!href) throw new Error("Published homepage does not declare a site icon.");
          const icon = new URL(href, base);
          const expectedPath = base.pathname.endsWith("/") ? base.pathname : base.pathname + "/";
          if (icon.pathname !== expectedPath + "icon.svg") {
            throw new Error(`Site icon escaped the GitHub Pages base path: ${icon.pathname}`);
          }
          process.stdout.write(icon.href);
          NODE
          )"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$icon_url" --output "$icon_file"
          grep -q "<svg" "$icon_file"

          # Site-owned editorial images must be served by this Pages origin.
          for asset in images/site/hero-480.webp images/site/hero-768.webp images/site/hero-1600.webp images/site/editorial-1200.webp; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
              "${base_url}${asset}" --output "$site_image_file"
            node - "$site_image_file" "$asset" <<'NODE'
          const fs = require("node:fs");
          const [file, asset] = process.argv.slice(2);
          const bytes = fs.readFileSync(file);
          if (bytes.length < 512 || bytes.toString("ascii", 0, 4) !== "RIFF" ||
              bytes.toString("ascii", 8, 12) !== "WEBP") {
            throw new Error(`Published site image is not a valid WebP asset: ${asset}`);
          }
          NODE
          done

          product_image_url="${base_url}${PRODUCT_IMAGE_PATH#/}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$product_image_url" --output "$site_image_file"
          node - "$site_image_file" "$PRODUCT_IMAGE_PATH" <<'NODE'
          const fs = require("node:fs");
          const [file, asset] = process.argv.slice(2);
          const bytes = fs.readFileSync(file);
          const valid = (asset.endsWith(".jpg") && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) ||
            (asset.endsWith(".png") && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) ||
            (asset.endsWith(".webp") && bytes.toString("ascii", 0, 4) === "RIFF" && bytes.toString("ascii", 8, 12) === "WEBP");
          if (!valid || bytes.length < 512) throw new Error(`Published local catalog image is invalid: ${asset}`);
          NODE

          gallery_image_url="${base_url}${GALLERY_IMAGE_PATH#/}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$gallery_image_url" --output "$gallery_image_file"
          node - "$gallery_image_file" "$GALLERY_IMAGE_PATH" <<'NODE'
          const fs = require("node:fs");
          const [file, asset] = process.argv.slice(2);
          const bytes = fs.readFileSync(file);
          if (!asset.endsWith(".webp") || bytes.length < 1000 ||
              bytes.toString("ascii", 0, 4) !== "RIFF" || bytes.toString("ascii", 8, 12) !== "WEBP") {
            throw new Error(`Published additional product image is invalid: ${asset}`);
          }
          NODE

          product_url="${base_url}product/${PRODUCT_ID}/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$product_url" --output "$product_html"

          node - "$product_html" "$PRODUCT_ID" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const productID = process.argv[3];
          if (!/<h1\b[^>]*>/.test(html) || !html.includes(productID) || /<title>404[ -]/i.test(html)) {
            throw new Error(`Published product deep link is not the expected product page: ${productID}`);
          }
          if (!html.includes("gallery-arrow-next") || !html.includes("gallery-counter") ||
              /href=["']https?:\/\/(?:www\.)?amazon\./i.test(html)) {
            throw new Error("Published product detail page is missing its native image gallery or contains an outbound Amazon product link.");
          }
          NODE

          case_study_url="${base_url}case-study/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors \
            "$case_study_url" --output "$case_study_html"

          node - "$case_study_html" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          for (const expected of [
            "یک بازار جهانی",
            "مدل داده و روابط پایگاه‌داده",
            "DATABASE_ERD.md"
          ]) {
            if (!html.includes(expected)) {
              throw new Error(`Published case-study page is missing expected content: ${expected}`);
            }
          }
          if (/<title>404[ -]/i.test(html)) {
            throw new Error("Published case-study route returned a 404 page.");
          }
          NODE

          echo "GitHub Pages smoke test passed: homepage, basePath JavaScript asset, product route $PRODUCT_ID and bilingual portfolio case-study route."
