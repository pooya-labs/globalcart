name: Catalog CI
on:
  push:
    branches: [main, feat/m04-go-postgres-foundation]
    paths:
      - "lib/catalog/**"
      - "public/images/site/**"
      - "scripts/sync-site-imagery.mjs"
      - "scripts/sync-catalog.ts"
      - "scripts/check-lighthouse-budget.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/catalog-ci.yml"
  pull_request:
    paths:
      - "public/images/site/**"
      - "scripts/sync-site-imagery.mjs"
      - "lib/catalog/**"
      - "scripts/sync-catalog.ts"
      - "scripts/check-lighthouse-budget.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/catalog-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --no-audit --no-fund
          fi
      - name: Prepare optimized self-hosted site imagery
        run: npm run assets:sync
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run typecheck
      - name: Catalog and domain unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
