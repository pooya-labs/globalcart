name: Backend CI
on:
  push:
    branches: [main, feat/m04-go-postgres-foundation]
    paths: ["backend/**", "go.mod", "go.sum", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "go.mod", "go.sum", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Resolve Go modules and checksums
        run: go mod tidy
      - name: Persist Go module checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): resolve Go module checksums [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Format Go sources
        run: gofmt -w backend
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Build API and importer
        run: |
          go build -o /tmp/globalcart-api ./backend/cmd/api
          go build -o /tmp/globalcart-catalog-import ./backend/cmd/catalog-import
      - name: Build container image
        run: docker build -f backend/Dockerfile -t globalcart-api:ci .
